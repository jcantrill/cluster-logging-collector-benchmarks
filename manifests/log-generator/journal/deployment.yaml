apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: journalgen
    app.kubernetes.io/part-of: cluster-logging
  name: journalgen
  namespace: openshift-logging
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: journalgen
      app.kubernetes.io/part-of: cluster-logging
  template:
    metadata:
      annotations:
        target.workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
      labels:
        app.kubernetes.io/component: journalgen
        app.kubernetes.io/part-of: cluster-logging
    spec:
      nodeSelector:
        log-workload: benchmark
      containers:
      - env:
        - name: PAYLOAD_SIZE
          value: "10240" #1 Kb
        - name: SYSLOG_IDENTIFIER
          value: "journal_load_tester"
        - name: LINES_PER_SEC
          value: "10"
        args:
        - -c 
        - 'msg=$(printf "A%.0s" $(seq 1 $PAYLOAD_SIZE)); tot=0; while true; do for i in $(seq 1 $LINES_PER_SEC) ; do tot=$((tot+1)); echo "$tot | $msg" | systemd-cat -t $SYSLOG_IDENTIFIER; done; sleep 1.0s; done'
        command:
        - sh
        image: registry.access.redhat.com/ubi9/ubi
        imagePullPolicy: IfNotPresent
        name: generator
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - FSETID
            - KILL
            - NET_BIND_SERVICE
            - SETGID
            - SETPCAP
            - SETUID
          readOnlyRootFilesystem: true
          seLinuxOptions:
            type: spc_t
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /run/systemd/journal
          name: journal
          readOnly: true
      dnsPolicy: ClusterFirst
      priorityClassName: system-node-critical
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: logcollector
      serviceAccountName: logcollector
      terminationGracePeriodSeconds: 10
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node.kubernetes.io/disk-pressure
        operator: Exists
      volumes:
      - hostPath:
          path: /usr/bin
          type: ""
        name: usrbin
      - hostPath:
          path: /run/systemd/journal
          type: ""
        name: journal
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 100%
    type: RollingUpdate
